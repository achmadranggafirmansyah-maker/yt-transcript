<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transkrip YouTube</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1a1d23;--muted:#667085;--line:#e4e7ec;--accent:#2b59ff;--accent-d:#1f43c7;--err:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#eceef2;--muted:#98a2b3;--line:#262b36;--accent:#5b82ff;--accent-d:#7a98ff;--err:#ff7b80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:1.75rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 280px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{padding:12px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;max-width:100%}
button{padding:12px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--accent-d)}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ghost:hover{background:var(--line)}
#err{color:var(--err);margin:14px 0 0;min-height:1.5em}
#result{display:none;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.body{padding:20px}
#title{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 16px}
#preview{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.95rem}
#preview p{margin:0 0 10px}
#preview time{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:8px;font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tab{background:none;color:var(--muted);border-radius:0;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{background:none;color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#up{display:flex;gap:8px;flex-wrap:wrap}
#up input[type=file]{padding:9px 12px}
#vid{display:none;width:100%;aspect-ratio:16/9;background:#000}
#preview.clk time{cursor:pointer;text-decoration:underline}
#prog{color:var(--muted);font-size:.9rem;margin:10px 0 0}
</style>
</head>
<body>
<main>
  <h1>Transkrip YouTube</h1>
  <p class="sub">Tempel link video, lihat transkripnya, lalu unduh sebagai dokumen.</p>

  <div class="tabs" role="tablist">
    <button type="button" class="tab on" id="tabYt">Link YouTube</button>
    <button type="button" class="tab" id="tabUp">Upload video</button>
  </div>

  <form id="f">
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." aria-label="Link YouTube" autocomplete="off" required>
    <select id="lang" aria-label="Bahasa transkrip"></select>
    <button id="go" type="submit">Ambil transkrip</button>
  </form>
  <div id="up" hidden>
    <input id="file" type="file" accept="video/*,audio/*" aria-label="Pilih file video">
    <select id="lang2" aria-label="Bahasa video"></select>
    <button id="goUp" type="button">Buat transkrip</button>
  </div>
  <p id="prog" hidden></p>
  <p id="err" role="alert"></p>

  <section id="result">
    <img id="thumb" alt="Thumbnail video">
    <video id="vid" controls playsinline></video>
    <div class="body">
      <h2 id="title"></h2>
      <p class="meta" id="meta"></p>
      <div id="preview"></div>
      <div class="actions">
        <button id="dlDoc">Unduh dokumen (.doc)</button>
        <button id="dlTxt" class="ghost">Unduh teks (.txt)</button>
        <button id="copy" class="ghost">Salin</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = null;

const getId = (s) => {
  s = s.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s.startsWith("http") ? s : "https://" + s);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1, 12);
    if (u.searchParams.get("v")) return u.searchParams.get("v");
    const m = u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
    if (m) return m[2];
  } catch {}
  return null;
};
const fmt = (t) => {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = (n) => String(n).padStart(2, "0");
  return (h ? h + ":" : "") + p(m) + ":" + p(s);
};
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const plain = () => data.items.map((i) => `[${fmt(i.t)}] ${i.text}`).join("\n");
const fileName = () => (data.title || data.id).replace(/[^\w\- ]+/g, "").trim().slice(0, 60) || data.id;

function save(content, type, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + content], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

const names = new Intl.DisplayNames(["id"], { type: "language" });
const langName = (c) => { try { return names.of(c); } catch { return c; } };
const common = ["id", "en", "ar", "es", "fr", "de", "ja", "ko", "zh", "pt", "ru", "hi"];
function fillLangs(codes, selected) {
  const list = codes && codes.length ? codes : common;
  const sel = $("lang");
  sel.innerHTML = '<option value="">Bahasa: Otomatis</option>' +
    list.map((c) => `<option value="${c}">${langName(c)}</option>`).join("");
  sel.value = list.includes(selected) ? selected : "";
}
fillLangs();

async function load(id, lang) {
  $("err").textContent = "";
  $("go").disabled = true; $("lang").disabled = true; $("go").textContent = "Memuat...";
  try {
    const r = await fetch("/api/transcript?id=" + id + (lang ? "&lang=" + lang : ""));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    data = j;
    $("vid").style.display = "none"; $("vid").pause(); $("thumb").style.display = "block";
    $("preview").classList.remove("clk");
    $("thumb").src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
    $("thumb").onerror = function () { this.onerror = null; this.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`; };
    $("title").textContent = j.title || "Video YouTube";
    $("meta").textContent = `${j.items.length} baris transkrip` + (j.lang ? " · " + langName(j.lang) : "");
    $("preview").innerHTML = j.items.map((i) => `<p><time>${fmt(i.t)}</time>${esc(i.text)}</p>`).join("");
    $("result").style.display = "block";
    fillLangs(j.availableLangs, lang || j.lang);
  } catch (er) {
    $("err").textContent = er.message || "Terjadi kesalahan.";
    if (!data) $("result").style.display = "none";
  }
  $("go").disabled = false; $("lang").disabled = false; $("go").textContent = "Ambil transkrip";
}

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = getId($("url").value);
  if (!id) { $("err").textContent = "Link YouTube tidak valid."; return; }
  if (data && data.id !== id) data = null;
  load(id, $("lang").value);
});
$("lang").addEventListener("change", () => {
  const id = getId($("url").value);
  if (id && data) load(id, $("lang").value);
});


const ytLine = (k) => {
  if (data.source === "file") return k === "html" ? "" : "";
  const u = "https://www.youtube.com/watch?v=" + data.id;
  return k === "html" ? `<p>${u}</p>` : u + "\n";
};

// ---------- Mode: Link YouTube / Upload video ----------
function setMode(up) {
  $("tabUp").classList.toggle("on", up); $("tabYt").classList.toggle("on", !up);
  $("f").hidden = up; $("up").hidden = !up;
  $("err").textContent = ""; $("prog").hidden = true;
  $("result").style.display = "none"; $("vid").pause(); data = null;
}
$("tabYt").onclick = () => setMode(false);
$("tabUp").onclick = () => setMode(true);
$("lang2").innerHTML = '<option value="">Bahasa: Otomatis</option>' +
  common.map((c) => `<option value="${c}">${langName(c)}</option>`).join("");

// ---------- Upload video -> audio 16 kHz mono -> potongan WAV ----------
async function extractAudio(file) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC({ sampleRate: 16000 });
  let buf;
  try { buf = await ctx.decodeAudioData(await file.arrayBuffer()); }
  finally { ctx.close(); }
  const n = buf.length, ch = buf.numberOfChannels, mono = new Float32Array(n);
  for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
  return { mono, sr: buf.sampleRate };
}
function toWav(x, sr) {
  const b = new ArrayBuffer(44 + x.length * 2), v = new DataView(b);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + x.length * 2, true); w(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, x.length * 2, true);
  for (let i = 0; i < x.length; i++) { const s = Math.max(-1, Math.min(1, x[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([b], { type: "audio/wav" });
}
async function sendChunk(blob, offset, lang) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const r = await fetch(`/api/transcribe-chunk?offset=${offset}${lang ? "&lang=" + lang : ""}`, {
      method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob,
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    if (attempt || r.status === 429 || r.status === 500) throw new Error(j.error || "Gagal mentranskrip audio.");
  }
}
function renderUp(items) {
  $("meta").textContent = `${items.length} baris transkrip`;
  $("preview").innerHTML = items.map((i) => `<p><time data-t="${i.t}">${fmt(i.t)}</time>${esc(i.text)}</p>`).join("");
}

$("goUp").onclick = async () => {
  const file = $("file").files[0], lang = $("lang2").value;
  $("err").textContent = "";
  if (!file) { $("err").textContent = "Pilih file video dulu."; return; }
  if (file.size > 200 * 1024 * 1024) { $("err").textContent = "File terlalu besar (maks 200 MB)."; return; }
  $("goUp").disabled = true; $("file").disabled = true; $("lang2").disabled = true;
  $("prog").hidden = false; $("prog").textContent = "Membaca audio dari video...";
  try {
    const { mono, sr } = await extractAudio(file);
    const sec = Math.min(110, Math.floor(3800000 / (2 * sr)));
    const size = sec * sr, total = Math.ceil(mono.length / size);
    const items = [];
    data = { source: "file", id: file.name, title: file.name.replace(/\.[^.]+$/, ""), items, lang };
    $("vid").src = URL.createObjectURL(file);
    $("vid").style.display = "block"; $("thumb").style.display = "none";
    $("title").textContent = data.title;
    $("preview").classList.add("clk");
    $("result").style.display = "block";
    for (let k = 0; k < total; k++) {
      const part = mono.subarray(k * size, (k + 1) * size);
      if (part.length < sr / 2) continue;
      $("prog").textContent = `Mentranskrip bagian ${k + 1} dari ${total}...`;
      const j = await sendChunk(toWav(part, sr), k * sec, lang);
      items.push(...j.items);
      if (!data.lang && j.lang) data.lang = j.lang;
      renderUp(items);
    }
    if (!items.length) throw new Error("Tidak ada suara yang terdeteksi di video ini.");
    $("meta").textContent += data.lang ? " · " + langName(data.lang) : "";
    $("prog").hidden = true;
  } catch (er) {
    $("err").textContent = er.name === "EncodingError" || /decode/i.test(er.message)
      ? "Gagal membaca audio dari file ini. Coba format MP4, WebM, MP3, atau WAV."
      : er.message || "Terjadi kesalahan.";
    $("prog").hidden = true;
    if (!data || !data.items.length) $("result").style.display = "none";
  }
  $("goUp").disabled = false; $("file").disabled = false; $("lang2").disabled = false;
};
$("preview").addEventListener("click", (e) => {
  const t = e.target.closest("time[data-t]");
  if (t && data && data.source === "file") { $("vid").currentTime = +t.dataset.t; $("vid").play(); }
});

$("dlDoc").onclick = () => {
  const body = data.items.map((i) => `<p><b>[${fmt(i.t)}]</b> ${esc(i.text)}</p>`).join("");
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(data.title)}</title></head><body style="font-family:Calibri,Arial;font-size:11pt"><h1>${esc(data.title)}</h1>${ytLine("html")}<hr>${body}</body></html>`;
  save(html, "application/msword", fileName() + ".doc");
};
$("dlTxt").onclick = () => save(`${data.title}\n${ytLine("txt")}\n${plain()}`, "text/plain", fileName() + ".txt");
$("copy").onclick = async () => {
  await navigator.clipboard.writeText(plain());
  $("copy").textContent = "Tersalin";
  setTimeout(() => ($("copy").textContent = "Salin"), 1500);
};
</script>
</body>
</html>
